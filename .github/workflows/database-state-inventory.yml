name: Read-only database state inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-state-inventory
  cancel-in-progress: false

env:
  LIFECYCLE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  environment-policy:
    name: Verify the protected aws-plan branch policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require aws-plan to allow exactly main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_url="repos/${GITHUB_REPOSITORY}/environments/aws-plan"
          deployment_policy="$(gh api "$environment_url" --jq '.deployment_branch_policy | [.custom_branch_policies, .protected_branches] | @json')"
          if [[ "$deployment_policy" != '[true,false]' ]]; then
            echo "::error::Environment aws-plan must use an explicit branch allowlist."
            exit 1
          fi
          allowed_branches="$(gh api --paginate "$environment_url/deployment-branch-policies" --jq '.branch_policies[].name' | sort)"
          if [[ "$allowed_branches" != 'main' ]]; then
            echo "::error::Environment aws-plan must allow exactly main."
            exit 1
          fi

  inventory:
    name: Inventory exact database state objects
    if: github.ref == 'refs/heads/main'
    needs: [environment-policy]
    runs-on: ubuntu-latest
    environment: aws-plan
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the original trusted lifecycle actor before AWS credentials
        env:
          LIFECYCLE_TRUSTED_OPERATORS: ${{ vars.LIFECYCLE_TRUSTED_OPERATORS || '' }}
        run: python3 scripts/require_trusted_lifecycle_operator.py

      - name: Require the exact database plan role
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN || '' }}
        run: |
          set -euo pipefail
          expected_role_arn="arn:aws:iam::035611741563:role/auto-shop/gh-plan-database-infra"
          if [[ "$AWS_PLAN_ROLE_ARN" != "$expected_role_arn" ]]; then
            echo "::error::State inventory requires the exact database-infra read-only plan role."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read and summarize the three version-pinned states
        run: |
          set -euo pipefail
          umask 077
          temp_dir="$(mktemp -d "$RUNNER_TEMP/database-state-inventory.XXXXXX")"
          chmod 700 "$temp_dir"
          trap 'rm -rf -- "$temp_dir"' EXIT

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != '035611741563' ]]; then
            echo "::error::AWS identity is not the expected database account."
            exit 1
          fi

          bucket="auto-shop-tfstate-035611741563-use1"
          for environment in staging hml prd; do
            key="database-infra/$environment/terraform.tfstate"
            state_file="$temp_dir/$environment.tfstate"
            metadata_file="$temp_dir/$environment.metadata.json"
            diagnostic_file="$temp_dir/$environment.aws.stderr"

            if ! aws s3api head-object \
              --bucket "$bucket" \
              --key "$key" \
              --query '{VersionId: VersionId, ContentLength: ContentLength}' \
              --output json >"$metadata_file" 2>"$diagnostic_file"; then
              echo "::error::Could not read metadata for the $environment state; private diagnostics were discarded."
              exit 1
            fi
            if ! metadata="$(python3 scripts/validate_s3_state_metadata.py "$metadata_file" 2>"$diagnostic_file")"; then
              echo "::error::The $environment state is not a versioned object with valid metadata."
              exit 1
            fi
            read -r version_id content_length <<< "$metadata"
            if (( content_length > 10485760 )); then
              echo "::error::The $environment state exceeds the inventory size limit."
              exit 1
            fi

            if ! downloaded_version="$(aws s3api get-object \
              --bucket "$bucket" \
              --key "$key" \
              --version-id "$version_id" \
              "$state_file" \
              --query VersionId \
              --output text 2>"$diagnostic_file")"; then
              echo "::error::Could not read the pinned $environment state version; private diagnostics were discarded."
              exit 1
            fi
            if [[ "$downloaded_version" != "$version_id" ]]; then
              echo "::error::The downloaded $environment state version did not match its metadata."
              exit 1
            fi
            chmod 600 "$state_file"
          done

          if ! python3 scripts/database_state_inventory.py \
            --state "staging=$temp_dir/staging.tfstate" \
            --state "hml=$temp_dir/hml.tfstate" \
            --state "prd=$temp_dir/prd.tfstate" \
            > "$temp_dir/inventory.md" 2>"$temp_dir/inventory.stderr"; then
            echo "::error::State inventory validation failed; private diagnostics were discarded."
            exit 1
          fi
          cat "$temp_dir/inventory.md" >> "$GITHUB_STEP_SUMMARY"
