name: Destroy database staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type destroy to remove the ephemeral database staging session
        required: true
        type: string
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-database
  cancel-in-progress: false

env:
  TF_VERSION: 1.15.8
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: destroy ephemeral staging database
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.confirm == 'destroy')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      - name: Remove bootstrap Kubernetes remnants while the cluster exists
        id: upstream
        run: |
          set -euo pipefail
          umask 077
          temp_dir="$(mktemp -d "$RUNNER_TEMP/database-destroy-preflight.XXXXXX")"
          chmod 700 "$temp_dir"
          trap 'rm -rf "$temp_dir"' EXIT
          cluster_present=true
          if ! aws ssm get-parameter --name /auto-shop/staging/eks/cluster-name --query 'Parameter.Value' --output text > "$temp_dir/cluster.txt" 2> "$temp_dir/cluster-parameter.stderr"; then
            if grep -Eq 'ParameterNotFound|ParameterNotFoundException' "$temp_dir/cluster-parameter.stderr"; then
              cluster_present=false
              echo "The upstream cluster-name contract is absent; Kubernetes cleanup is skipped." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::The upstream cluster contract could not be read for a non-missing-parameter reason."
              exit 1
            fi
          fi

          if [[ "$cluster_present" == true ]]; then
            cluster_name="$(cat "$temp_dir/cluster.txt")"
            if aws eks describe-cluster --name "$cluster_name" > "$temp_dir/cluster.json" 2> "$temp_dir/cluster.stderr"; then
              if ! aws eks update-kubeconfig --name "$cluster_name" --region us-east-1 > "$temp_dir/kubeconfig.log" 2>&1; then
                echo "::error::Kubeconfig setup failed; Kubernetes cleanup was not verified."
                exit 1
              fi
              if ! kubectl -n auto-shop-ops delete job/auto-shop-db-bootstrap configmap/auto-shop-db-bootstrap-sql configmap/auto-shop-db-bootstrap-settings serviceaccount/auto-shop-db-bootstrap --ignore-not-found > "$temp_dir/kubernetes-cleanup.log" 2>&1; then
                echo "::error::Bootstrap Kubernetes cleanup failed; private diagnostics were discarded."
                exit 1
              fi
              echo "Bootstrap Kubernetes remnants removed." >> "$GITHUB_STEP_SUMMARY"
            elif grep -q 'ResourceNotFoundException' "$temp_dir/cluster.stderr"; then
              cluster_present=false
              echo "The upstream EKS cluster is already absent; Kubernetes cleanup is skipped." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::EKS describe failed for a reason other than an absent cluster."
              exit 1
            fi
          fi

          echo "cluster_present=$cluster_present" >> "$GITHUB_OUTPUT"

      - name: Destroy Terraform root and verify no owned resources remain
        env:
          UPSTREAM_CLUSTER_PRESENT: ${{ steps.upstream.outputs.cluster_present }}
        run: |
          set -euo pipefail
          umask 077
          stack="envs/staging/database"
          temp_dir="$(mktemp -d "$RUNNER_TEMP/database-destroy.XXXXXX")"
          chmod 700 "$temp_dir"
          trap 'rm -rf "$temp_dir"' EXIT
          has_resources=false
          if ! terraform -chdir="$stack" init -input=false -lock-timeout=300s > "$temp_dir/init.log" 2>&1; then
            echo "::error::Terraform init failed; private diagnostics were discarded."
            exit 1
          fi
          if terraform -chdir="$stack" state list > "$temp_dir/state-list.txt" 2> "$temp_dir/state.stderr"; then
            if [[ -s "$temp_dir/state-list.txt" ]]; then
              if ! terraform -chdir="$stack" output -json > "$temp_dir/outputs.json" 2> "$temp_dir/outputs.stderr"; then
                echo "::error::Terraform output metadata could not be captured before destroy."
                exit 1
              fi
              cp "$temp_dir/outputs.json" "$temp_dir/manifest.json"
              has_resources=true
            else
              printf '{}\n' > "$temp_dir/manifest.json"
            fi
          elif grep -q 'No state file was found' "$temp_dir/state.stderr"; then
            printf '{}\n' > "$temp_dir/manifest.json"
          else
            echo "::error::Terraform state could not be inspected; no destroy was started."
            exit 1
          fi
          chmod 600 "$temp_dir/manifest.json"
          if [[ "$has_resources" == true ]]; then
            destroy_args=(destroy -input=false -auto-approve -lock-timeout=300s)
            if [[ "$UPSTREAM_CLUSTER_PRESENT" == false ]]; then
              # The previous apply stored the non-secret SSM values in state.
              # Use that snapshot only to remove the database stack after its
              # upstream cluster has already been removed.
              destroy_args+=(-refresh=false)
            fi
            if ! terraform -chdir="$stack" "${destroy_args[@]}" > "$temp_dir/destroy.log" 2>&1; then
              echo "::error::Terraform destroy failed; private diagnostics were discarded and no automatic state removal was attempted."
              exit 1
            fi
            echo "Terraform destroy completed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Terraform-managed database resources were found; skipping Terraform destroy." >> "$GITHUB_STEP_SUMMARY"
          fi
          ./scripts/orphans.sh "$temp_dir/manifest.json" | tee -a "$GITHUB_STEP_SUMMARY"
